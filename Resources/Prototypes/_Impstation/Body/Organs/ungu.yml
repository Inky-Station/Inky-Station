- type: entity
  id: OrganUnguStomach
  parent: OrganHumanStomach
  name: ungu stomach
  description: A lot going on here.
  components:
  - type: Item
    size: Normal
  - type: SolutionManager
    solutions:
    - SolutionUnguStomach
  - type: Solution
    solution:
      maxVol: 15
      reagents:
      - ReagentId: UncookedAnimalProteins
        Quantity: 12
  - type: Stomach
    isSpecialDigestibleExclusive: true
    specialDigestible:
      tags:
      - Fruit
      - Pill
      - Crayon
      - Paper
      - BananaPeel
      - Ruminant
      - Wheat
      - Vegetable
      - Flower
      - Mushroom

- type: entity
  parent: SolutionStomach
  id: SolutionUnguStomach
  categories: [ HideSpawnMenu ]
  components:
  - type: Solution
    solution:
      maxVol: 200

- type: entity
  parent: OrganHumanEyes
  id: OrganUnguEyes
  components:
  - type: VisualOrgan
    data:
      sprite: _Impstation/Mobs/Species/Ungu/parts.rsi
      state: eyes
  - type: VisualOrganMarkings
    markingData:
      group: Ungu
