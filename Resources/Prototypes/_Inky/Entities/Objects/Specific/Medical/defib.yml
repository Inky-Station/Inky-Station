- type: entity
  id: BaseManualDefibrillator
  parent: BaseItem
  name: manual defibrillator
  description: flip, sssscratch sssscratch, click, CLEAR! ZZZZZZAP!
#  abstract: true
  components:
  - type: Sprite
    sprite: Objects/Specific/Medical/defib.rsi
    layers:
    - state: icon
    - state: screen
      map: [ "enum.ToggleableVisuals.Layer" ]
      visible: false
      shader: unshaded
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.ToggleableVisuals.Enabled:
        enum.ToggleableVisuals.Layer:
          True: { visible: true }
          False: { visible: false }
  - type: Item
    size: Large
  - type: Speech
    speechVerb: Robotic
#  - type: ItemToggle
#    soundActivate:
#      path: /Audio/Items/Defib/defib_safety_on.ogg
#    soundDeactivate:
#      path: /Audio/Items/Defib/defib_safety_off.ogg
  - type: Defibrillator
    allowDoAfterMovement: false # inkymed
    zapHeal:
      types:
        Asphyxiation: -40
  - type: DoAfter
  - type: UseDelay
  - type: StaticPrice
    price: 30
  - type: GuideHelp
    guides:
    - MedicalDoctor
  - type: LanguageSpeaker # Einstein Engines - Language
    speaks:
    - TauCetiBasic
    understands:
    - TauCetiBasic
  - type: ManualDefibrillator
    pulseState: Pulse100
  - type: ActivatableUI
    key: enum.ManualDefibrillatorUiKey.Key
    inHandsOnly: true
    requireActiveHand: false
  - type: UserInterface
    interfaces:
      enum.ManualDefibrillatorUiKey.Key:
        type: ManualDefibrillatorBui
