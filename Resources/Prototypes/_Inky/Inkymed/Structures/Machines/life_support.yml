- type: entity
  parent:
  - StructureWheeled
  - BaseStructureDynamic
  - PowerCellSlotHighItem
  id: StructureLifeSupport
  name: life support
  description: A tv mounted on wheels, capable of oxygenizing and improving heart state of those who are connected. Has a short wire.
  components:
  - type: Sprite
    noRot: true
    sprite: _Inky/Inkymed/Structures/Machines/lifesupport.rsi
    layers:
    - state: base
    - map: [ "screen" ]
      state: off
      shader: unshaded
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.LifeSupportVisuals.ScreenState:
        screen:
          Off: { state: off }
          Indifferent: { state: on-indifferent }
          Alive: { state: on-alive }
          Critical: { state: on-crit }
          Dead: { state: on-dead }
  - type: LifeSupportMachine
  - type: InteractionOutline
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default
        startingItem: null
  - type: PowerCellDraw
    drawRate: 2
  - type: ToggleCellDraw
  - type: ItemToggle
    onUse: false

- type: entity
  id: StructureLifeSupportFilled
  parent: StructureLifeSupport
  suffix: Battery
  components:
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default
        startingItem: PowerCellHigh
