- type: entity
  abstract: true
  id: ActionBaseWerewolf
  parent: BaseAction
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _Inky/Actions/Werewolf/werewolf.rsi
  - type: Action
    useDelay: 30
    itemIconStyle: NoItem

- type: entity
  parent: ActionBaseWerewolf
  id: ActionWerewolfHowl
  name: Howl
  description: Scream as loud as you can, stunning everyone in radius.
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    layers:
    - state: howl
  - type: InstantAction
    event: !type:HowlEvent {}
  - type: WerewolfAction
    hungerCost: 30
    requireTransfurmed: true

- type: entity
  parent: ActionBaseWerewolf
  id: ActionWerewolfTransfurm
  name: Transfurm
  description: Transfurm into a werewolf. Be warned as you can transfurm back only after 2 minutes.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    useDelay: 0
  - type: Sprite
    layers:
    - state: transfurm
  - type: InstantAction
    event: !type:TransfurmEvent {}

- type: entity
  parent: ActionBaseWerewolf
  id: ActionWerewolfOpenMutationStore
  name: Open mutation store
  description: Open the mutation menu.
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    layers:
    - state: store
  - type: InstantAction
    event: !type:WerewolfOpenStoreEvent {}

- type: entity
  id: PulseThermalVisionWerewolf
  parent:
  - ActionBaseWerewolf
  - ToggleThermalVision
  name: Heightened Senses
  description: Gives you 10 seconds of thermal vision
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _Inky/Actions/Werewolf/werewolf.rsi
    layers:
    - state: senses

- type: entity
  parent: ActionBaseWerewolf
  id: ActionWerewolfAbsorb
  name: Bite
  description: Bite and rip a limb from your fellow comrade for points.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    useDelay: 5
  - type: Sprite
    layers:
    - state: bite
  - type: TargetAction
    interactOnMiss: false
  - type: EntityTargetAction
    whitelist:
      components:
      - Body
    canTargetSelf: false
    event: !type:WerewolfDevourEvent {}

- type: entity
  parent: ActionBaseWerewolf
  id: ActionWerewolfGut
  name: Gut
  description: Spills one of the chest organs of a deceased crew member onto the floor. Organs that are produced from this ability grant you Fury.
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    layers:
    - state: gut
  - type: TargetAction
    interactOnMiss: false
  - type: EntityTargetAction
    whitelist:
      components:
      - Body
    canTargetSelf: false
    event: !type:WerewolfGutEvent {}
  - type: WerewolfAction
    hungerCost: 0
    requireTransfurmed: true

- type: entity
  parent: ActionBaseWerewolf
  id: ActionWerewolfRegen
  name: increased metabolism
  description: Increase your metabolism, providing healing at the cost of a lot of hunger.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    useDelay: 10
  - type: Sprite
    layers:
    - state: regen
  - type: InstantAction
    event: !type:WerewolfRegenEvent
  - type: WerewolfAction
    hungerCost: 65
#    requireTransfurmed: true

- type: entity
  parent: ActionBaseWerewolf
  id: ActionWerewolfJump
  name: Jump
  description: Stun your enemies with a quick jump. Costs 30 hunger.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    checkCanInteract: false
    priority: 0
    useDelay: 20
  - type: Sprite
    layers:
    - state: ambush
  - type: TargetAction
    checkCanAccess: false
    range: 15
  - type: WorldTargetAction
    event: !type:WerewolfAmbushActionEvent
  - type: WerewolfAction
    hungerCost: 30
    requireTransfurmed: true

# direwolf specific

- type: entity
  parent: ActionBaseWerewolf
  id: ActionWerewolfHowlDire
  name: Roar
  description: Scream as loud as you can, stunning everyone in radius.
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    layers:
    - state: howl-red
  - type: InstantAction
    event: !type:HowlEvent
      shriekPower: 4
      stunDuration: 2
  - type: WerewolfAction
    hungerCost: 45 # since its more powerful
    requireTransfurmed: true

- type: entity
  parent: ActionBaseWerewolf
  id: ActionWerewolfBiteDire
  name: Bleeding bite
  description: Sink your canines into a victim, and steal 30% of their blood. This will heal you slightly.
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    layers:
    - state: bleeding-bite
  - type: TargetAction
    interactOnMiss: false
  - type: EntityTargetAction
    whitelist:
      components:
      - Body
    canTargetSelf: false
    event: !type:WerewolfBleedingBiteEvent { }
  - type: WerewolfAction
    hungerCost: 20
    requireTransfurmed: true

# white specific

- type: entity
  parent: ActionBaseWerewolf
  id: ActionWerewolfTransfurmWhite
  name: Transfurm
  description: Transfurm into a werewolf. Be warned as you can transfurm back only after 2 minutes.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    useDelay: 0
  - type: Sprite
    layers:
    - state: transfurm
  - type: InstantAction
    event: !type:TransfurmWhiteEvent {}

# black specific

- type: entity
  parent: ActionBaseWerewolf
  id: ActionWerewolfBiteBlack
  name: Bleeding bite
  description: Bite a victim, causing massive blood loss. Has a 50% chance to infect the victim into a Werewolf under your rule.
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    layers:
    - state: black-bite
  - type: TargetAction
    interactOnMiss: false
  - type: EntityTargetAction
    whitelist:
      components:
      - Body
    canTargetSelf: false
    event: !type:WerewolfBlackBiteEvent { }
  - type: WerewolfAction
    hungerCost: -30
    requireTransfurmed: true

- type: entity
  parent: ActionBaseWerewolf
  id: ActionWerewolfHowlBlack
  name: Alpha order
  description: Howl and command every werewolf in radius to transform into their superior form, and heal those who already are transformed.
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    layers:
    - state: howl-green
  - type: InstantAction
    event: !type:HowlEvent
      shriekPower: 4
      stunDuration: 1
      forceTransfurm: true
      healNearby: true
  - type: WerewolfAction
    hungerCost: 30
    requireTransfurmed: true

- type: entity
  parent: ActionBaseWerewolf
  id: ActionWerewolfBeckon
  name: Beckon
  description: Silently transmits your location to your allied Werewolves
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    layers:
    - state: beckon
  - type: InstantAction
    event: !type:WerewolfBeckonEvent
  - type: WerewolfAction
    hungerCost: 0

- type: entity
  parent: ActionBaseWerewolf
  id: ActionWerewolfBequeath
  name: Bequeath
  description: Crown an Unmutated Werewolf in your pack to become the next Black Wolf in case of your death.
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    layers:
    - state: bequeath
  - type: TargetAction
    interactOnMiss: false
  - type: EntityTargetAction
    whitelist:
      components:
      - WerewolfAbilities
    canTargetSelf: false
    event: !type:WerewolfBequeathEvent {}
  - type: WerewolfAction
    hungerCost: 0
    requireTransfurmed: true

- type: entity
  parent: ActionBaseWerewolf
  id: ActionWerewolfBlackCall
  name: Black Call
  description: Force transform yourself, and everyone in your pack, permamently. Doubles you and your packs health. Requires a minimum of 4 pack members to use.
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    layers:
    - state: call
  - type: InstantAction
    event: !type:WerewolfBlackCallEvent {}

# hell

- type: entity
  parent: ActionBaseWerewolf
  id: ActionWerewolfJumpHell
  name: Blitz And Burn
  description: Jump and burn your foes!
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    checkCanInteract: false
    priority: 0
    useDelay: 20
  - type: Sprite
    layers:
    - state: burn
  - type: TargetAction
    checkCanAccess: false
    range: 15
  - type: WorldTargetAction
    event: !type:WerewolfAmbushActionEvent
      entitySpawnOnEvent: MolotovFire # MolotovHellFire ?
  - type: WerewolfAction
    hungerCost: 30
    requireTransfurmed: true

- type: entity
  parent: ActionBaseWerewolf
  id: ActionWerewolfHowlHell
  name: Gather the Damned
  description: Howl, setting people around you on fire.
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    layers:
    - state: damn
  - type: InstantAction
    event: !type:HowlEvent
      targetEffects:
      - !type:Flammable # copypasted from ash blade pls test if its too much/too little
        multiplier: 2.5
        fireProtectionPenetration: 0.35
      - !type:Ignite
  - type: WerewolfAction
    hungerCost: 30
    requireTransfurmed: true

- type: entity
  parent: ActionBaseWerewolf
  id: ActionWerewolfBanish
  name: Banish
  description: Strike a target in range, stunning it accordingly to how much 'on fire' they are.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    useDelay: 45
  - type: Sprite
    layers:
    - state: banish
  - type: TargetAction
    interactOnMiss: false
  - type: EntityTargetAction
    whitelist:
      components:
      - MobState
    canTargetSelf: false
    event: !type:WerewolfBanishEvent {}
  - type: WerewolfAction
    hungerCost: 20
    requireTransfurmed: false # TROLLFACE
