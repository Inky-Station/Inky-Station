- type: entity
  abstract: true
  id: ActionBaseWerewolf
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _Inky/Actions/Werewolf/werewolf.rsi

- type: entity
  parent: [ActionBaseWerewolf, BaseAction]
  id: ActionWerewolfHowl
  name: Howl
  description: Scream as loud as you can, stunning everyone in radius.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    useDelay: 30
    itemIconStyle: NoItem
  - type: Sprite
    layers:
    - state: howl
  - type: InstantAction
    event: !type:HowlEvent {}
  - type: WerewolfAction
    hungerCost: 30
    requireTransfurmed: true

- type: entity
  parent:
  - BaseAction
  - ActionBaseWerewolf
  id: ActionWerewolfTransfurm
  name: Transfurm
  description: Transfurm into a werewolf. Be warned as you can transfurm back only after 2 minutes.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    itemIconStyle: NoItem
  - type: Sprite
    layers:
    - state: transfurm
  - type: InstantAction
    event: !type:TransfurmEvent {}

- type: entity
  parent:
  - BaseAction
  - ActionBaseWerewolf
  id: ActionWerewolfOpenMutationStore
  name: Open mutation store
  description: Open the mutation menu.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    itemIconStyle: NoItem
  - type: Sprite
    layers:
    - state: store
  - type: InstantAction
    event: !type:WerewolfOpenStoreEvent {}

- type: entity
  id: PulseThermalVisionWerewolf
  parent:
  - ToggleThermalVision
  - ActionBaseWerewolf
  name: Heightened Senses
  description: Gives you 10 seconds of thermal vision
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    useDelay: 30
  - type: Sprite
    layers:
    - state: senses

- type: entity
  parent:
  - BaseAction
  - ActionBaseWerewolf
  id: ActionWerewolfAbsorb
  name: Bite
  description: Bite and rip a limb from your fellow comrade for points.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    useDelay: 5
    itemIconStyle: NoItem
  - type: Sprite
    layers:
    - state: bite
  - type: TargetAction
    interactOnMiss: false
  - type: EntityTargetAction
    whitelist:
      components:
      - Body
    canTargetSelf: false
    event: !type:WerewolfDevourEvent {}

- type: entity
  parent:
  - BaseAction
  - ActionBaseWerewolf
  id: ActionWerewolfGut
  name: Gut
  description: Spills one of the chest organs of a deceased crew member onto the floor. Organs that are produced from this ability grant you Fury.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    itemIconStyle: NoItem
  - type: Sprite
    layers:
    - state: gut
  - type: TargetAction
    interactOnMiss: false
  - type: EntityTargetAction
    whitelist:
      components:
      - Body
    canTargetSelf: false
    event: !type:WerewolfGutEvent {}
  - type: WerewolfAction
    hungerCost: 0
    requireTransfurmed: true

- type: entity
  parent:
  - BaseAction
  - ActionBaseWerewolf
  id: ActionWerewolfRegen
  name: increased metabolism
  description: Increase your metabolism, providing healing at the cost of a lot of hunger.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    useDelay: 10
    itemIconStyle: NoItem
  - type: Sprite
    layers:
    - state: regen
  - type: InstantAction
    event: !type:WerewolfRegenEvent
  - type: WerewolfAction
    hungerCost: 65
#    requireTransfurmed: true

- type: entity
  parent:
  - BaseAction
  - ActionBaseWerewolf
  id: ActionWerewolfJump
  name: Jump
  description: Stun your enemies with a quick jump. Costs 30 hunger.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    checkCanInteract: false
    priority: 0
    useDelay: 20
  - type: Sprite
    layers:
    - state: ambush
  - type: TargetAction
    checkCanAccess: false
    range: 15
  - type: WorldTargetAction
    event: !type:WerewolfAmbushActionEvent
  - type: WerewolfAction
    hungerCost: 30
    requireTransfurmed: true

# direwolf specific

- type: entity
  parent:
  - BaseAction
  - ActionBaseWerewolf
  id: ActionWerewolfHowlDire
  name: Roar
  description: Scream as loud as you can, stunning everyone in radius.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    useDelay: 30
    itemIconStyle: NoItem
  - type: Sprite
    layers:
    - state: howl-red
  - type: InstantAction
    event: !type:HowlEvent
      shriekPower: 4
      stunDuration: 2
  - type: WerewolfAction
    hungerCost: 45 # since its more powerful
    requireTransfurmed: true

- type: entity
  parent:
  - BaseAction
  - ActionBaseWerewolf
  id: ActionWerewolfBiteDire
  name: Bleeding bite
  description: Sink your canines into a victim, and steal 30% of their blood. This will heal you slightly.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    useDelay: 30
    itemIconStyle: NoItem
  - type: Sprite
    layers:
    - state: bleeding-bite
  - type: TargetAction
    interactOnMiss: false
  - type: EntityTargetAction
    whitelist:
      components:
      - Body
    canTargetSelf: false
    event: !type:WerewolfBleedingBiteEvent { }
  - type: WerewolfAction
    hungerCost: 20
    requireTransfurmed: true

# white specific

- type: entity
  parent:
  - BaseAction
  - ActionBaseWerewolf
  id: ActionWerewolfTransfurmWhite
  name: Transfurm
  description: Transfurm into a werewolf. Be warned as you can transfurm back only after 2 minutes.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
  - type: Sprite
    layers:
    - state: transfurm
  - type: InstantAction
    event: !type:TransfurmWhiteEvent {}

# black specific

- type: entity
  parent:
  - BaseAction
  - ActionBaseWerewolf
  id: ActionWerewolfBiteBlack
  name: Bleeding bite
  description: Bite a victim, causing massive blood loss. Has a 50% chance to infect the victim into a Werewolf under your rule.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    useDelay: 30
  - type: Sprite
    layers:
    - state: black-bite
  - type: TargetAction
    interactOnMiss: false
  - type: EntityTargetAction
    whitelist:
      components:
      - Body
    canTargetSelf: false
    event: !type:WerewolfBlackBiteEvent { }
  - type: WerewolfAction
    hungerCost: -30
    requireTransfurmed: true

- type: entity
  parent:
  - BaseAction
  - ActionBaseWerewolf
  id: ActionWerewolfHowlBlack
  name: Alpha order
  description: Howl and command every werewolf in radius to transform into their superior form, and heal those who already are transformed.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    useDelay: 30
  - type: Sprite
    layers:
    - state: howl-green
  - type: InstantAction
    event: !type:HowlEvent
      shriekPower: 4
      stunDuration: 1
      forceTransfurm: true
      healNearby: true
  - type: WerewolfAction
    hungerCost: 30
    requireTransfurmed: true

- type: entity
  parent:
  - BaseAction
  - ActionBaseWerewolf
  id: ActionWerewolfBeckon
  name: Beckon
  description: Silently transmits your location to your allied Werewolves
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    useDelay: 30
    itemIconStyle: NoItem
  - type: Sprite
    layers:
    - state: beckon
  - type: InstantAction
    event: !type:WerewolfBeckonEvent
  - type: WerewolfAction
    hungerCost: 0

- type: entity
  parent:
  - BaseAction
  - ActionBaseWerewolf
  id: ActionWerewolfBequeath
  name: Bequeath
  description: Crown an Unmutated Werewolf in your pack to become the next Black Wolf in case of your death.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
  - type: Sprite
    layers:
    - state: bequeath
  - type: TargetAction
    interactOnMiss: false
  - type: EntityTargetAction
    whitelist:
      components:
      - WerewolfAbilities
    canTargetSelf: false
    event: !type:WerewolfBequeathEvent {}
  - type: WerewolfAction
    hungerCost: 0
    requireTransfurmed: true

- type: entity
  parent:
  - BaseAction
  - ActionBaseWerewolf
  id: ActionWerewolfBlackCall
  name: Black Call
  description: Force transform yourself, and everyone in your pack, permamently. Doubles you and your packs health. Requires a minimum of 4 pack members to use.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
  - type: Sprite
    layers:
    - state: call
  - type: InstantAction
    event: !type:WerewolfBlackCallEvent {}
