- type: polymorph
  id: WerewolfTransformBasic
  configuration:
    entity: WerewolfWerewolf
    forced: true
    inventory: None
    transferName: false
    transferDamage: true
    revertOnCrit: true
    revertOnDeath: false
    duration: 480
    polymorphSound: /Audio/_Goobstation/Changeling/Effects/armour_transform.ogg # goida
    componentsToTransfer:
    - component: WerewolfBasicAbilities
    - component: Store
    - component: CollectiveMind

