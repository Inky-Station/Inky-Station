- type: polymorph
  id: WerewolfTransformBasic
  configuration:
    entity: WerewolfWerewolf
    forced: true
    inventory: None
    transferName: false
    transferDamage: true
    revertOnCrit: true
    revertOnDeath: false
    polymorphSound: /Audio/_Goobstation/Changeling/Effects/armour_transform.ogg # goida
    componentsToTransfer:
    - component: WerewolfAbilities # todo werewolf KILL
    - component: Store
    - component: CollectiveMind
    - component: WerewolfBit
    - component: WerewolfInfectionImmune
    - component: Hunger

