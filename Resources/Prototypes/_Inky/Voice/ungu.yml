- type: speechSounds
  id: Ungu
  saySound:
    path: /Audio/_Inky/Voice/Ungu/ungu_talk.ogg
  askSound:
    path: /Audio/_Inky/Voice/Ungu/ungu_ask.ogg
  exclaimSound:
    path: /Audio/_Inky/Voice/Ungu/ungu_yell.ogg

- type: emoteSounds
  id: UnisexUngu
  voiceSelectorName: species-name-ungu
  params:
    variation: 0.025
  sounds:
    Scream:
      path: /Audio/_Inky/Voice/Ungu/ungu_scream.ogg
    Laugh:
      path: /Audio/_Inky/Voice/Ungu/ungu_laugh.ogg
    Sneeze:
      collection: MaleSneezes
    CatMeow:
      collection: CatMeows
    CatHisses:
      collection: CatHisses
    MonkeyScreeches:
      collection: MonkeyScreeches
    RobotBeep:
      collection: RobotBeeps
    Yawn:
      path: /Audio/_Inky/Voice/Ungu/ungu_yawn.ogg
    Snore:
      collection: Snores
    Honk:
      collection: BikeHorn
    Crying:
      path: /Audio/_Inky/Voice/Ungu/ungu_cry.ogg
    Whistle:
      collection: Whistles
    Weh:
      collection: Weh
    Hew:
      collection: Hew
    Gasp:
      path: /Audio/_Inky/Voice/Ungu/ungu_gasp.ogg
    DefaultDeathgasp:
      path: /Audio/_Inky/Voice/Ungu/ungu_death_gasp.ogg
    Sigh:
      path: /Audio/_Inky/Voice/Ungu/ungu_sigh.ogg
    Cough:
      collection: MaleCoughs
    Moo:
      path: /Audio/Animals/cow_moo.ogg
      params:
        variation: 0.2
    Jump:
      collection: Jump

- type: emoteSounds
  parent: GeneralBodyEmotes
  id: UnguBodyEmotes
  sounds:
    Jump:
      collection: Jump
      params:
        volume: -1
        variation: 0.1
    Clap:
      collection: Claps
      params:
        pitch: .55
    Snap:
      collection: Snaps
      params:
        volume: -3

- type: emote
  id: Moo
  name: chat-emote-name-moo
  category: Vocal
  available: false
  chatMessages: [ chat-emote-msg-moo ]
  chatTriggers: [ moo, moos ]
