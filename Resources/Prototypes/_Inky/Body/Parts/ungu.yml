- type: entity
  abstract: true
  parent: OrganBaseOrganic
  id: OrganUnguExternal
  suffix: ungu
  components:
  - type: Sprite
    sprite: _Inky/Mobs/Species/Ungu/parts.rsi
  - type: VisualOrgan
    data:
      sprite: _Inky/Mobs/Species/Ungu/parts.rsi
    secondData:
      sprite: _Inky/Mobs/Species/Ungu/parts.rsi
  - type: VisualOrganMarkings
    markingData:
      group: Ungu

- type: entity
  parent: [ OrganBaseTorso, OrganUnguExternal ]
  id: OrganUnguTorso
  components:
  - &ungu_wound_visuals
    type: WoundableVisuals
    damageGroupSprites:
      Brute: _Inky/Mobs/Effects/ungu_brute_damage.rsi
      Burn: _Shitmed/Mobs/Effects/burn_damage.rsi
    damageGroupColors:
      Brute: "#ff624a"
  - type: VisualOrganMarkings
    markingData:
      layers: [ Chest, Tail, Overlay, TailOverlay, UndergarmentTop, UndergarmentBottom, Special ]

- type: entity
  parent: [ OrganBaseHead, OrganUnguExternal ]
  id: OrganUnguHead
  components:
  - *ungu_wound_visuals
  - type: VisualOrganMarkings
    hideableLayers:
    - enum.HumanoidVisualLayers.Hair
    - enum.HumanoidVisualLayers.HeadTop
    - enum.HumanoidVisualLayers.HeadSide
    - enum.HumanoidVisualLayers.Snout

- type: entity
  parent: [ OrganBaseArmLeft, OrganUnguExternal ]
  id: OrganUnguArmLeft
  components:
  - *ungu_wound_visuals
  - type: VisualOrganMarkings
    markingData:
      layers: [ LArm, LHand ]

- type: entity
  parent: [ OrganBaseArmRight, OrganUnguExternal ]
  id: OrganUnguArmRight
  components:
  - *ungu_wound_visuals
  - type: VisualOrganMarkings
    markingData:
      layers: [ RArm, RHand ]

- type: entity
  parent: [ OrganBaseLegLeft, OrganUnguExternal ]
  id: OrganUnguLegLeft
  components:
  - *ungu_wound_visuals
  - type: Leg
    sprintSpeed: 2.9
    walkSpeed: 1.3
  - type: VisualOrganMarkings
    markingData:
      layers: [ LLeg, LFoot ]
    hideableLayers:
    - enum.HumanoidVisualLayers.LFoot

- type: entity
  parent: [ OrganBaseLegRight, OrganUnguExternal ]
  id: OrganUnguLegRight
  components:
  - *ungu_wound_visuals
  - type: Leg
    sprintSpeed: 2.9
    walkSpeed: 1.3
  - type: VisualOrganMarkings
    markingData:
      layers: [ RLeg, RFoot ]
    hideableLayers:
    - enum.HumanoidVisualLayers.RFoot
